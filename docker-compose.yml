version: '3.8'

# =============================================================================
#  AEGISCORE AI - Orquestación General del Ecosistema Distribuido
#  Sistema ERP, Peritaje Inteligente y Liquidación Autónoma de Siniestros
#  4 Niveles Arquitectónicos:
#    - Nivel 1: Keycloak SSO (OIDC / OAuth2) + Micro-Frontends
#    - Nivel 2: 4 Microservicios (PHP DDD, NestJS Clean, Spring Boot Hexagonal, Python MCP)
#    - Nivel 3: Persistencia Políglota (PostgreSQL 16, MongoDB 7, DynamoDB Local)
#    - Nivel 4: Apache Kafka (Saga), n8n Automation (WhatsApp/Facturación)
# =============================================================================

networks:
  aegiscore-network:
    driver: bridge
    name: aegiscore-network

volumes:
  postgres_erp_data:
    name: aegiscore_postgres_erp_data
  mongo_siniestros_data:
    name: aegiscore_mongo_siniestros_data
  dynamodb_local_data:
    name: aegiscore_dynamodb_local_data
  n8n_workflow_data:
    name: aegiscore_n8n_workflow_data

services:
  # ===========================================================================
  # NIVEL 3: PERSISTENCIA POLÍGLOTA
  # ===========================================================================

  # 1. PostgreSQL 16 (Relacional ACID para Pólizas, Facturas, Pagos y Saga)
  postgres-erp:
    image: postgres:16-alpine
    container_name: aegiscore-postgres-erp
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegiscore_erp}
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AegisCore2026Secure!}
    volumes:
      - postgres_erp_data:/var/lib/postgresql/data
      - ./infra/db-init/postgres-init.sql:/docker-entrypoint-initdb.d/01-postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis_admin} -d ${POSTGRES_DB:-aegiscore_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aegiscore-network

  # 2. MongoDB 7 (Documental para Expedientes de Siniestros, Peritajes e IA)
  mongo-siniestros:
    image: mongo:7.0
    container_name: aegiscore-mongo-siniestros
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-aegiscore_siniestros}
    volumes:
      - mongo_siniestros_data:/data/db
      - ./infra/db-init/mongo-init.js:/docker-entrypoint-initdb.d/01-mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aegiscore-network

  # 3. Amazon DynamoDB Local (Clave-Valor para IdempotencyRecords y Sesiones SSO)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: aegiscore-dynamodb-local
    restart: unless-stopped
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb_local_data:/home/dynamodblocal/data
    networks:
      - aegiscore-network

  # Inicializador automático de tablas en DynamoDB Local
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: aegiscore-dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo 'Esperando arranque de DynamoDB...' &&
       sleep 3 &&
       aws dynamodb create-table --table-name IdempotencyRecords --attribute-definitions AttributeName=idempotency_key,AttributeType=S --key-schema AttributeName=idempotency_key,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000 --region us-east-1 2>/dev/null || true &&
       aws dynamodb create-table --table-name SesionesSSO --attribute-definitions AttributeName=session_id,AttributeType=S --key-schema AttributeName=session_id,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb-local:8000 --region us-east-1 2>/dev/null || true &&
       echo 'Tablas DynamoDB creadas exitosamente.'"
    networks:
      - aegiscore-network

  # ===========================================================================
  # NIVEL 1 & 4: SSO, EVENT BUS Y AUTOMATIZACIÓN
  # ===========================================================================

  # 4. Keycloak SSO (OAuth2 / OIDC con JWT RS256 para los 3 Frontends)
  keycloak-sso:
    image: quay.io/keycloak/keycloak:24.0
    container_name: aegiscore-keycloak-sso
    restart: unless-stopped
    command: "start-dev --import-realm"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin123*}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./infra/keycloak-sso/aegiscore-realm.json:/opt/keycloak/data/import/aegiscore-realm.json:ro
    networks:
      - aegiscore-network

  # 5. Apache Kafka & Zookeeper (Bus de Eventos y Orquestación Saga CU09)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aegiscore-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aegiscore-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aegiscore-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - aegiscore-network

  # 6. n8n Automation (Pedidos WhatsApp -> ERP Factura PDF & Siniestros Emergencia)
  n8n-automation:
    image: n8nio/n8n:latest
    container_name: aegiscore-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: America/La_Paz
    volumes:
      - n8n_workflow_data:/home/node/.n8n
      - ./automation-n8n:/workflows:ro
    networks:
      - aegiscore-network

  # ===========================================================================
  # NIVEL 2: MICROSERVICIOS BACKEND
  # ===========================================================================

  # 7. MS1: Pólizas, Clientes y Facturación (PHP 8.3 / Laravel DDD)
  ms1-polizas-php:
    build:
      context: ./backend/ms1-polizas-php
      dockerfile: Dockerfile
    container_name: aegiscore-ms1-polizas-php
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-neondb}
      DB_USERNAME: ${DB_USERNAME:-neondb_owner}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      KAFKA_BROKERS: kafka:29092
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - aegiscore-network

  # 8. MS2: Siniestros, Triaje y Notificaciones Push (NestJS Clean Arch + CQRS)
  ms2-siniestros-nestjs:
    build:
      context: ./backend/ms2-siniestros-nestjs
      dockerfile: Dockerfile
    container_name: aegiscore-ms2-siniestros-nestjs
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      MONGODB_URI: ${MONGODB_URI}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-aegiscore_siniestros_db}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_TABLE_IDEMPOTENCY: ${DYNAMODB_TABLE_IDEMPOTENCY:-AegisCore_IdempotencyRecords}
      KAFKA_BROKER: kafka:29092
    networks:
      - aegiscore-network

  # 9. MS3: Motor Actuarial, Cobros QR y Orquestador Saga (Java 21 / Spring Boot 3 Hexagonal)
  ms3-actuarial-springboot:
    build:
      context: ./backend/ms3-actuarial-springboot
      dockerfile: Dockerfile
    container_name: aegiscore-ms3-actuarial-springboot
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-neondb_owner}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_TABLE_IDEMPOTENCY: ${DYNAMODB_TABLE_IDEMPOTENCY:-AegisCore_IdempotencyRecords}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - aegiscore-network

  # 10. MS4: Inteligencia Artificial, Agentes y Servidor MCP (Python 3.11 / FastAPI)
  ms4-ia-mcp-python:
    build:
      context: ./backend/ms4-ia-mcp-python
      dockerfile: Dockerfile
    container_name: aegiscore-ms4-ia-mcp-python
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: ${MONGODB_URI}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-aegiscore_siniestros_db}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_TABLE_IDEMPOTENCY: ${DYNAMODB_TABLE_IDEMPOTENCY:-AegisCore_IdempotencyRecords}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - aegiscore-network
