<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AegisCore AI — Portal ERP & BI Actuarial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Tipografías Oficiales Stitch MCP: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CSS CDN con Preset Executive Precision -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#005c55",
            "primary-container": "#0f766e",
            "on-primary": "#ffffff",
            "on-primary-container": "#a3faef",
            "primary-fixed": "#9cf2e8",
            "primary-fixed-dim": "#80d5cb",
            secondary: "#565e74",
            "secondary-container": "#dae2fd",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#5c647a",
            tertiary: "#3f33d6",
            "tertiary-container": "#5951ef",
            "on-tertiary": "#ffffff",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-dim": "#cbdbf5",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#3e4947",
            "inverse-surface": "#0f172a",
            "inverse-on-surface": "#f8fafc",
            outline: "#6e7977",
            "outline-variant": "#bdc9c6",
            error: "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };

</head>
<body class="bg-background font-body text-on-surface antialiased">
  <app-root></app-root>
